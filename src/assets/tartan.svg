<svg
            viewBox="0 0 150 280"
            width="150"
            height="280"
            x="0"
            y="0"
            xmlns="http://www.w3.org/2000/svg"
        >
        <defs>
            <pattern id="diagonalStripes" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
                <polygon points="0,4 0,8 8,0 4,0" fill="#ffffff" />
                <polygon points="4,8 8,8 8,4" fill="#ffffff" />
            </pattern>
            <mask id="grating" x="0" y="0" width="1" height="1">
                <rect x="0" y="0" width="100%" height="100%" fill="url(#diagonalStripes)" />
            </mask>
        </defs>
        <g id="horizontalStripes">
            <rect fill="#121212" width="100%" height="40" x="0" y="0" />
            <rect fill="#c6bdac" width="100%" height="35" x="0" y="40" />
            <rect fill="#121212" width="100%" height="20" x="0" y="75" />
            <rect fill="#676767" width="100%" height="50" x="0" y="95" />
            <rect fill="#7d2b32" width="100%" height="10" x="0" y="145" />
            <rect fill="#676767" width="100%" height="50" x="0" y="155" />
            <rect fill="#121212" width="100%" height="20" x="0" y="205" />
            <rect fill="#c6bdac" width="100%" height="35" x="0" y="225" />
            <rect fill="#121212" width="100%" height="40" x="0" y="260" />
        </g>
        <g id="verticalStripes" mask="url(#grating)">
            <rect fill="#121212" width="20" height="100%" x="0" y="0" />
            <rect fill="#676767" width="50" height="100%" x="20" y="0" />
            <rect fill="#7d2b32" width="10" height="100%" x="70" y="0" />
            <rect fill="#676767" width="50" height="100%" x="80" y="0" />
            <rect fill="#121212" width="20" height="100%" x="130" y="0" />
        </g>
        <g id="notch">
            <polygon points="-5,280 155,280 75,230" fill="white" />
        </g>
    </svg>